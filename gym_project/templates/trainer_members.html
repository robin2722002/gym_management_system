<!DOCTYPE html>
<html>

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .profile-card {
            width: 420px;
            margin: auto;
            margin-top: 80px;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 15px;
        }

        .profile-info {
            text-align: center;
            margin-top: 20px;
        }

        .profile-info p {
            margin: 6px 0;
            font-size: 16px;
        }

        .btn-group {
            margin-top: 20px;
        }
        
.glass-table{
background: rgba(4, 4, 4, 0.08);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border-radius:15px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.2);
}

.glass-table th,
.glass-table td{
background: transparent !important;
color:white;
border:2px solid rgba(15, 14, 14, 0.2);
text-align:center;
}

.glass-table tr:hover{
background: rgba(255,255,255,0.15);
transition:0.3s;
}
    </style>
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center">My Members 💪</h2>

        <table class="table glass-table mt-4">

            <tr>
                <th>Name</th>
                <th>Profile</th>
            </tr>

            {% for booking in bookings %}

            <tr>

                <td><b>{{ booking.member.name }}</b></td>

                <td>
                    <a href="{% url 'member_profile' booking.member.id %}" class="btn btn-primary btn-sm">
                        View Profile
                    </a>
                </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="2" class="text-center">No members yet</td>
            </tr>

            {% endfor %}

        </table>
        <div class="btn-group  justify-content-between mt-4">
            <a href="{% url 'trainer_profile' %}" class="btn btn-light ">Back</a>
        </div>

    </div>

</body>

</html>
