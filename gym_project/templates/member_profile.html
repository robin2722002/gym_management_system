<!DOCTYPE html>
<html>

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <head>

        {% load static %}
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            .profile-card {
                width: 420px;
                margin: auto;
                margin-top: 80px;
                padding: 30px;
                text-align: center;
                border-radius: 20px;
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(12px);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            }

            .profile-img {
                width: 140px;
                height: 140px;
                border-radius: 50%;
                object-fit: cover;
                border: 4px solid white;
                margin-bottom: 15px;
            }

            .profile-info {
                text-align: center;
                margin-top: 20px;
            }

            .profile-info p {
                margin: 6px 0;
                font-size: 16px;
            }

            .btn-group {
                margin-top: 20px;
            }
        </style>


    </head>

</head>

<body>
<br><br><br>
    <div class="container mt-5" >
        <div class="profile-card">
        <h3 class="mb-3 text-center">Member Profile</h3>

            {% if member.profile_photo %}
            <img src="{{ member.profile_photo.url }}" class="profile-img mx-auto d-block">
            {% endif %}

            <div class="profile-info mt-3">

                <h4><b>{{ member.name }}</b></h4>

                <p><b>Phone:   {{ member.phone }}</b></p>

                <p><b>Email:   {{ member.email }}</b></p>

                <p><b>Weight:   {{ member.weight }}</b></p>

                <p><b>Joining Date:   {{ member.joining_date }}</b></p>

            </div>
            <div class="btn-group  justify-content-between mt-4">
            <a  href="{% url 'trainer_members' %}" class="btn btn-light" >Back</a>
            </div>

        </div>
        </div>

    </div>

</body>

</html>
