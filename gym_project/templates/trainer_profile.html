<head>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .profile-card {
            width: 420px;
            margin: auto;
            margin-top: 80px;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 15px;
        }

        .profile-info {
            text-align: center;
            margin-top: 20px;
        }

        .profile-info p {
            margin: 6px 0;
            font-size: 16px;
        }

        .btn-group {
            margin-top: 20px;
        }
    </style>


</head>

<body>
<nav class="navbar navbar-dark position-relative custom-navbar"></nav>
    <div class="container-fluid">
            <h1 class="position-absolute start-50 translate-middle-x m-0"
                style="color:#00407f; font-size:40px; font-weight:bold; text-align: center; text-shadow:2px 2px 10px rgb(239, 238, 238);">
                Welcome {{ request.user.name }} 💪
            </h1>
    </div>

<div class="container">
    <div class="profile-card">
           
                <h3 class="mb-3 text-center">Your Profile</h3>
                {% if trainer.user.profile_photo %}
                <img src="{{ trainer.profile_photo.url }}" class="profile-img mx-auto d-block">
                {% endif %}
                <div class="profile-info mt-3">

                    <p><b>Name : {{ trainer.user.name }}</b></p>
                    <p><b>Email : {{ trainer.user.email }}</b></p>
                    <p><b>Phone : {{ trainer.user.phone }}</b></p>
                    <p><b>Experience : {{ trainer.experience }} years</b></p>
                </div>
                <div class="btn-group  justify-content-between mt-4">
                    <a  href="{% url 'trainer_members' %}" class="btn btn-secondary" >Members</a>
                    <a href="{% url 'edit_trainer_profile' %}" class="btn btn-light">Edit Profile</a>
                    <a  href="{% url 'logout_trainer' %}" class="btn btn-danger" >Logout</a>

                </div>
    </div>
</div>
</body>
