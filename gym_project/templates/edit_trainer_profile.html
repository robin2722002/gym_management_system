<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
    
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h3 class="text-center mb-4">Update Profile</h3>
<form class="glass-form" method="POST" enctype="multipart/form-data">
{% csrf_token %}

<label>Name</label>
<input type="text" name="name" value="{{ trainer.user.name }}"><br><br>

<label>Email</label>
<input type="email" name="email" value="{{ trainer.user.email }}"><br><br>

<label>Phone</label>
<input type="text" name="phone" value="{{ trainer.user.phone }}"><br><br>

<label>Experience</label>
<input type="number" name="experience" value="{{ trainer.experience }}"><br><br>

<label>Profile Photo</label>
<input type="file" name="profile_photo"><br><br>

 <button class="btn btn-dark w-100">Update</button>
            <a href="{% url 'trainer_profile' %}">Back</a>

</form>
    </div>
</div>
</body>
