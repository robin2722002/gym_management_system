<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>

<body>

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h3 class="text-center mb-4">Create Account</h3>

        <form class="glass-form" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">
                    <label>Name</label>
                    <input type="text" name="name" class="form-control">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control">
                    <label for="">Password</label>
                     <input type="password" name="password" placeholder="Password" required class="form-control">

                    <label>Email</label>
                    <input type="email" name="email" class="form-control">
                
                    <label>Phone</label>
                    <input type="text" name="phone" class="form-control">
                
                    <label>Weight</label>
                    <input type="number" name="weight" class="form-control">
                    <label for="">Joining Date</label>
                     <input type="date" name="joining_date" class="form-control">
                
                    <label>Profile Photo</label>
                    <input type="file" name="profile_photo" class="form-control">
            </div>

            <button class="btn btn-dark w-100 mt-3">Register</button>
        </form>
    </div>
</div>

</body>
