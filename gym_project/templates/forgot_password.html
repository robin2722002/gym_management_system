<body class="d-flex justify-content-center align-items-center" style="height:100vh;">

<div class="card shadow-lg p-4" style="width:400px; border-radius:15px;">

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<h3 class="text-center mb-4">RESET PASSWORD</h3>

<form class="glass-form" method="POST">
{% csrf_token %}

<input type="text" name="username" placeholder="Username" class="form-control mb-3" required>

<input type="email" name="email" placeholder="Email" class="form-control mb-3" required>

<input type="password" name="new_password" placeholder="New Password" class="form-control mb-3" required>

<button class="btn btn-dark w-100">RESET PASSWORD</button>

</form>

<br>

<a href="{% url 'login' %}">Back to Login</a>

</div>
</body>
