
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class=" d-flex justify-content-center align-items-center"  style="height:100vh;">

<div class="card shadow-lg p-4" style="width:400px; border-radius:15px;">
<!-- 
    <!-  Messages inside card -->  
      {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %} 

    {% if error %}
<div class="alert alert-danger text-center">
    {{ error }}
</div>
{% endif %} 
    <h3 class="text-center mb-4" style="color:#002e5d; font-size:40px; font-weight:bold; text-shadow:2px 2px 10px white;">LOGIN</h3>

    <form class="glass-form" method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button class="btn btn-dark w-100">LOGIN</button>
    </form>

    <p class="text-center mt-3 text-white">
        New user? <a href="{% url 'register' %}" class="text-warning text-decoration-none">Create Account</a><br>
        <a href="{% url 'forgot_password' %}" class="text-danger text-decoration-none">Forgot Password?</a>
    </p>

</div>

</body>
