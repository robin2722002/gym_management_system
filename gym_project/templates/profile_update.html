
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>

<body >

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h3 class="text-center mb-4">Update Profile</h3>

        <form class="glass-form" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="">Name</label>
            <input type="text" name="name" value="{{ user.name }}" required><br><br>
            <LAbel>Email</LAbel>
            <input type="email" name="email" value="{{ user.email }}" required><br><br>
            <LABel>Phone</LABel>
            <input type="text" name="phone" value="{{ user.phone }}" required><br><br>
            <LABel>Weight</LABel>
            <input type="number" step="0.1" name="weight" value="{{ user.weight }}"><br><br>
            <LABel>Profile Photo</LABel>
            <input type="file" name="profile_photo"><br><br>

            {{ form.as_p }}

            <button class="btn btn-dark w-100">Update</button>
            <a href="{% url 'welcome' %}">Back</a>
        </form>
    </div>
</div>

</body>
